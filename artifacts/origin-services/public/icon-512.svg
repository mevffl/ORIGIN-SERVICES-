<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Shine overlay top half -->
  <rect width="512" height="260" rx="112" fill="url(#shine)"/>

  <!-- Subtle grid lines decoration -->
  <line x1="0" y1="170" x2="512" y2="170" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="0" y1="340" x2="512" y2="340" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="170" y1="0" x2="170" y2="512" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="512" stroke="white" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Main "O" letter -->
  <text
    x="52"
    y="348"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="290"
    fill="white"
    letter-spacing="-8"
  >O</text>

  <!-- "S" letter smaller, bottom right -->
  <text
    x="280"
    y="430"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="200"
    fill="white"
    opacity="1"
    letter-spacing="-4"
  >S</text>

  <!-- Accent dot top-right -->
  <circle cx="432" cy="88" r="38" fill="#60a5fa" opacity="0.85" filter="url(#glow)"/>
  <circle cx="432" cy="88" r="20" fill="white"/>

  <!-- Small accent ring bottom-left -->
  <circle cx="80" cy="432" r="24" stroke="#93c5fd" stroke-width="4" fill="none" opacity="0.6"/>
  <circle cx="80" cy="432" r="10" fill="#bfdbfe" opacity="0.5"/>
</svg>
